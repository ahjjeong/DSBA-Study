hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}/${hydra.job.override_dirname}
  output_subdir: null

defaults:
  - model: bert

seed: 42
device: cuda
backend: torch

dataset:
  name: stanfordnlp/imdb
  batch_size: 16
  val_size: 0.1
  test_size: 0.1
  max_length: 128
  num_labels: 2

optimizer:
  name: adam
  lr: 5e-5
  betas: [0.9, 0.999]
  eps: 1e-6
  weight_decay: 0.01

train:
  epochs: 5
  grad_accum_steps: 1
  max_grad_norm: 0.0

wandb:
  enable: true
  project: nlp-study-exp2-again
  entity: null
  mode: online
  save_code: true
