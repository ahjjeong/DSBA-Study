DEFAULT:
  exp_name: AnomalyTransformer
  seed: 42

DATASET:
  datadir: ../dataset
  dataname: PSM
  scaler: standard
  batch_size: 256
  shuffle: true
  num_workers: 0
  pin_memory: true
  drop_last: False
  seq_len: 100
  stride_len: 1
  target: ['case1']
  val_split_rate: 0.1
  bank_name: ['IUR']
  merge_bank: False
  time_embedding: [0, 'd']
  del_feature: null

TRAIN:
  epoch: 3
  ckp_metric: loss
  eval_epochs: 1
  log_epochs: 1
  log_eval_iter: 100
  early_stopping_count: 3
  early_stopping_metric: 'loss'
  resume: null
  pre_training: false
  data_num: 0
  fine_tuning_method: full
  grad_accum_steps: 1
  mixed_precision: 'no'
  lradj: 'type1'
  return_output: false
  plot_result: false
  del_pt_file: True
  wandb:
    use: true
    iter: 100
    exp_name: default
    project_name: 'TS-AD'
    entity: null
LOSS:
  loss_name: mse

OPTIMIZER:
  opt_name: adam
  lr: 0.0001
  params: {}

RESULT:
  savedir: './saved_model'
