iTransformer:
  d_model: 256      # embedding 차원
  d_ff: 256         # FFN hidden layer 차원
  e_layers: 2       # encoder layer 수 
  n_heads: 8        # multi-head attention head 수
  dropout: 0.1
  activation: gelu
  factor: 5
  output_attention: false
  embed: timeF
  freq: h
  class_strategy: projection
  use_norm: true